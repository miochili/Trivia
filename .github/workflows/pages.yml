# Builds the static peer-to-peer version and publishes it to the gh-pages
# branch on every push to main → https://<user>.github.io/<repo>/
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1
      - name: Push to gh-pages
        run: |
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
